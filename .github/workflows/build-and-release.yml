name: Build and release

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify committed plugin bundle
        run: git diff --exit-code -- main.js
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish installable release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
    permissions:
      contents: write
